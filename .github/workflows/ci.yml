name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            args: ./...
          - name: race
            args: -race ./...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
      - name: go test (${{ matrix.name }})
        run: go test ${{ matrix.args }}
